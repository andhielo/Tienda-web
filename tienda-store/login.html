<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Acceso de Usuarios | TOTTUS ONLINE</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-grid">
      <div class="logo-box">
        <a href="index.html">TOTTUS <span>ONLINE</span></a>
      </div>
      <div>
        <a href="index.html" class="btn-header-cart">&larr; VOLVER A LA TIENDA</a>
      </div>
    </div>
  </header>

  <div class="container auth-page-wrapper">
    <!-- Columna 1: Iniciar Sesión -->
    <section class="square-panel">
      <div class="panel-title-bar">
        <h2>YA TENGO UNA CUENTA (INICIAR SESIÓN)</h2>
      </div>
      <form id="login-form" class="panel-body" autocomplete="off">
        <div class="info-note">
          <strong>Acceso Cuenta Maestro (Admin):</strong><br>
          Correo: <code>admin@tottus.pe</code> | Contraseña: <code>Admin1234</code>
        </div>

        <div class="form-group">
          <label>Correo Electrónico:</label>
          <input type="email" id="login-email" required placeholder="usuario@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña:</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <p id="login-error" class="error-text"></p>
        <button type="submit" class="btn-primary-square">INGRESAR A MI CUENTA</button>
      </form>
    </section>

    <!-- Columna 2: Registrar Nuevo Usuario -->
    <section class="square-panel">
      <div class="panel-title-bar dark-bar">
        <h2>SOY CLIENTE NUEVO (REGISTRARME)</h2>
      </div>
      <form id="register-form" class="panel-body" autocomplete="off">
        <p class="panel-desc">Crea tu cuenta para realizar compras, guardar tu dirección y agilizar tus pagos.</p>

        <div class="form-group">
          <label>Nombres y Apellidos:</label>
          <input type="text" id="reg-name" required placeholder="Ej. Carlos Mendoza">
        </div>
        <div class="form-group">
          <label>DNI / Documento:</label>
          <input type="text" id="reg-dni" required maxlength="8" pattern="\d{8}" placeholder="8 dígitos">
        </div>
        <div class="form-group">
          <label>Correo Electrónico:</label>
          <input type="email" id="reg-email" required placeholder="carlos@correo.com">
        </div>
        <div class="form-group">
          <label>Crear Contraseña (Mín. 8 caracteres, 1 mayúscula y 1 número):</label>
          <input type="password" id="reg-password" required minlength="8" placeholder="Ej. Cliente2026">
        </div>

        <p id="reg-error" class="error-text"></p>
        <button type="submit" class="btn-dark-square full-width">REGISTRAR NUEVA CUENTA</button>
      </form>
    </section>
  </div>

  <script src="js/security.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
